<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDCA TimeBox Lite v0.2</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#fff;--text:#242421;--muted:#7d7a72;--line:#ddd9d0;
  --accent:#686f61;--soft:#eceee7;--box:#f1f1ee;--done:#e4edf1;--overdue:#f7e7e5;--hour-h:84px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1050px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px}
h1,h2,h3,p{margin:0}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.12em}.muted{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;color:var(--text)}
.tab.active,.btn.primary{background:var(--soft);border-color:transparent}
.summary{display:flex;align-items:center;gap:18px;overflow:auto;border-block:1px solid var(--line);padding:10px 2px;margin-bottom:14px}
.metric{white-space:nowrap}.metric span{display:block;font-size:10px;color:var(--muted)}.metric strong{font-size:14px}
.ring{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none}
.ring:after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;z-index:1;font-size:11px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}

/* Time-grid */
.timeline{position:relative}
.hour-row{display:grid;grid-template-columns:54px 1fr;gap:8px;height:var(--hour-h)}
.time{font-size:12px;color:var(--muted);padding-top:2px}
.lane{position:relative;border-top:1px solid var(--line)}
.lane:hover{background:rgba(108,115,95,.025)}
.empty-hit{position:absolute;inset:0;border:0;background:transparent;width:100%;text-align:left;color:transparent}
.timebox{
  position:absolute;left:4px;right:4px;border:1px solid var(--line);background:var(--box);border-radius:11px;
  padding:5px 8px;overflow:hidden;box-shadow:0 3px 10px rgba(20,20,18,.03);
  user-select:none;z-index:5;display:flex;align-items:center;
}
.timebox.dragging{opacity:.55;cursor:grabbing}
.timebox.done{background:var(--done);border-color:#cfd9de;color:#5e666a}
.timebox.overdue{background:var(--overdue);border-color:#ead0cd}
.timebox.done .muted{color:#8b8983}
.boxline{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.boxtext{min-width:0;flex:1;display:flex;align-items:center;gap:8px}
.boxtext strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.boxtext .muted{white-space:nowrap}
.fav{border:0;background:transparent;font-size:17px;padding:0;flex:none}
.actions{display:flex;gap:6px;flex:none}
.timebox .btn{padding:5px 9px;font-size:12px}
.resize-handle{position:absolute;left:0;right:0;height:7px;z-index:10;cursor:ns-resize}
.resize-top{top:0}.resize-bottom{bottom:0}
.resize-handle:after{content:"";position:absolute;left:45%;right:45%;height:2px;background:transparent}
.timebox:hover .resize-handle:after{background:#b8b6ae}

.timebox.done .btn.primary{background:#dededb}
.view{display:none}.view.active{display:block}
.form{display:block;margin-top:0}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(35,35,31,.28);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 20px 55px rgba(30,30,25,.16)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.modal-actions{display:flex;gap:7px;flex-wrap:wrap}
.template-pop{display:none;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:#faf9f5}
.template-pop.show{display:block}
.template-item{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:10px;padding:9px 10px;margin-top:6px}
.template-item strong{display:block}

label{display:block;font-size:12px;font-weight:650;margin:9px 0 4px}
input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subrow{display:grid;grid-template-columns:1fr 85px 38px;gap:6px;margin-top:6px}
.subrow button{border:1px solid var(--line);background:transparent;border-radius:8px}
.focus{display:none}.focus.show{display:block}
.focusTop{display:flex;justify-content:space-between;gap:10px}
.focusList{margin:16px 0 90px}
.focusRow{display:grid;grid-template-columns:30px 1fr;gap:8px}.step-toggle{cursor:pointer;user-select:none}.step-toggle:hover{opacity:.65}
.interrupt-row{display:grid;grid-template-columns:30px 1fr;gap:8px}.interrupt-row .focusBody{border-left-color:#c9b7a9}
.focusBody{border-left:2px solid var(--line);padding:9px 0 12px 10px}.focusRow.current .focusBody{border-color:var(--accent)}
.bottom{position:sticky;bottom:0;background:linear-gradient(to top,var(--panel) 75%,transparent);padding-top:10px;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:4px}
.cal-day{min-height:62px;border:1px solid var(--line);background:white;border-radius:10px;padding:6px;text-align:left;position:relative}
.cal-day.out{opacity:.35}.cal-day.selected{outline:2px solid var(--accent)}
.cal-day.today{background:#f0f1eb}
.cal-dot{position:absolute;bottom:6px;left:6px;font-size:10px;color:var(--accent)}

.hint{font-size:11px;color:var(--muted);margin-top:4px}

.input-clean{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}
.input-clean:focus{border-color:#a9afa1;box-shadow:0 0 0 3px rgba(104,111,97,.08)}
.field-row{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:end}
.field-caption{font-size:10px;color:var(--muted);letter-spacing:.08em;margin:0 0 4px 2px}
.time-sep{align-self:center;text-align:center;color:var(--muted);padding-top:14px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:18px;padding:0}
.icon-btn:hover{background:#f2f1ed}
.star-btn{font-size:22px;border:0;background:transparent;padding:2px 4px;color:#77736a}
.star-btn:hover{transform:scale(1.05)}
.sub-add{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:19px;padding:0}
.day-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.error-box{display:none;margin-top:8px;padding:9px 10px;border-radius:9px;background:#faecea;color:#9a4d47;font-size:12px}
.error-box.show{display:block}
.focus-shell{max-width:760px;margin:0 auto}
.focus-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}

@media(max-width:650px){
  header{align-items:flex-start;flex-direction:column}.wrap{padding:12px}.summary{gap:12px}.grid2{grid-template-columns:1fr 1fr}
  :root{--hour-h:78px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="eyebrow">DAQUO LAB / PROTOTYPE</div><h1>PDCA TimeBox</h1></div>
  <nav>
    <button class="tab active" data-v="today">TODAY</button>
    <button class="tab" data-v="calendar">CALENDAR</button>
    <button class="tab" data-v="analyze">ANALYZE</button>
  </nav>
</header>

<section id="today" class="view active">
  <div id="todayOverview">
    <div class="summary">
      <div id="ring" class="ring" style="--p:0"><b id="pct">0%</b></div>
      <div class="metric"><span>予定</span><strong id="sumPlan">0m</strong></div>
      <div class="metric"><span>実績</span><strong id="sumActual">0m</strong></div>
      <div class="metric"><span>差</span><strong id="sumDiff">0m</strong></div>
      <div class="metric"><span>時間内完了</span><strong id="sumOn">0/0</strong></div>
    </div>

    <div id="mainPanel" class="panel">
      <div class="head">
        <div id="todayDateTitle" class="day-title"></div>
      </div>
      <div id="timeline" class="timeline"></div>
    </div>

    <div id="todayCheckPanel" class="panel" style="margin-top:14px">
      <div class="head">
        <div>
          <div class="eyebrow">CHECK</div>
          <h2>Today's CHECK</h2>
          <p class="muted">今日の予定と実績</p>
        </div>
      </div>
      <div id="todayCheckList" class="cards"></div>
    </div>
  </div>

  <div id="focus" class="focus focus-shell">
    <div class="focus-card">
      <div class="focusTop">
        <button id="back" class="btn">← TODAY</button>
        <span id="status" class="muted"></span>
      </div>
      <div class="eyebrow" style="margin-top:14px">FOCUS</div>
      <h2 id="focusTitle" style="margin-top:3px"></h2>
      <div id="focusMeta" class="muted"></div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:18px">
        <div id="focusRing" class="ring" style="--p:0"><b id="focusPct">0%</b></div>
        <div>
          <span class="muted">ACTUAL</span>
          <div id="elapsed" style="font-size:28px;font-weight:700">0m</div>
        </div>
      </div>
      <div id="focusList" class="focusList"></div>
      <div id="interruptForm" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div style="display:flex;gap:8px">
          <input id="interruptName" class="input-clean" placeholder="割り込みタスク名（例：上司からの依頼対応）">
          <button id="interruptStart" class="btn primary">開始</button>
          <button id="interruptCancel" class="btn">×</button>
        </div>
      </div>
      <div class="bottom">
        <button id="interrupt" class="btn">割り込み</button>
        <button id="pause" class="btn">一時停止</button>
        <button id="done" class="btn primary">完了 ✓</button>
      </div>
    </div>
  </div>
</section>


<div id="editorModal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="eyebrow">PLAN</div>
        <h3 id="editorTitle">TimeBoxを作成</h3>
        <div id="editorHint" class="muted"></div>
      </div>
      <div class="modal-actions">
        <button id="templateBtn" class="star-btn" title="テンプレートを開く">★</button>
        <button id="closeEditor" class="icon-btn" aria-label="閉じる">×</button>
      </div>
    </div>

    <div id="templatePop" class="template-pop">
      <strong>保存済みテンプレート</strong>
      <div id="templateChoices"></div>
    </div>

    <div id="editor" class="form">
      <input id="name" class="input-clean" placeholder="タスク名（例：ブログ作成）">
      <div class="field-row" style="margin-top:10px">
        <div><div class="field-caption">START</div><input id="start" class="input-clean" type="time" value="09:00"></div>
        <div class="time-sep">—</div>
        <div><div class="field-caption">FINISH</div><input id="end" class="input-clean" type="time" value="10:00"></div>
      </div>
      <div class="head" style="margin-top:12px;margin-bottom:4px">
        <div><strong>サブタスク</strong><div id="alloc" class="muted">未入力ならTimeBox本体だけで実行</div></div>
        <button id="addSub" class="sub-add" title="サブタスクを追加">＋</button>
      </div>
      <div id="subs"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="cancel" class="btn">キャンセル</button>
        <button id="save" class="btn primary">保存</button>
      </div>
      <div id="msg" class="error-box"></div>
    </div>
  </div>
</div>


<section id="calendar" class="view">
  <div class="panel">
    <div class="head">
      <div>
        <h2>CALENDAR</h2>
        <p class="muted">日付を選んで、その日のCHECKを確認</p>
      </div>
      <div class="modal-actions">
        <button id="prevMonth" class="btn">‹</button>
        <button id="nextMonth" class="btn">›</button>
      </div>
    </div>
    <h3 id="calendarMonth" style="margin-bottom:10px"></h3>
    <div id="calendarGrid"></div>
    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <div class="eyebrow">CHECK</div>
      <h3 id="selectedDateTitle"></h3>
      <div id="selectedDateSummary" class="summary" style="margin-top:10px"></div>
      <div id="selectedDateList" class="cards"></div>
    </div>
  </div>
</section>

<section id="analyze" class="view">
  <div class="panel"><div class="head"><div><h2>ANALYZE</h2><p class="muted">1週間検証用の最小指標</p></div></div>
  <div class="cards">
    <div class="card"><span class="muted">TimeBox Score</span><h2 id="score">0%</h2></div>
    <div class="card"><span class="muted">予定比</span><h2 id="ratio">0%</h2></div>
    <div class="card"><span class="muted">割り込み</span><h2 id="intm">0m</h2></div>
  </div></div>
</section>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='pdca_timebox_lite_v2';
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state) state={next:2,templates:[],boxes:[{id:1,title:'Experiment記事を書く',start:'09:00',end:'10:30',favorite:true,status:'planned',actual:0,interrupt:0,subs:[{name:'構成確認',plan:15,actual:0,done:false},{name:'本文を書く',plan:50,actual:0,done:false},{name:'推敲',plan:25,actual:0,done:false}]}]};
if(!state.templates) state.templates=[];
if(!state.days){
  const todayKey=dateKeyLocal(new Date());
  state.days={};
  state.days[todayKey]={boxes:state.boxes||[]};
  delete state.boxes;
}
let currentDateKey=dateKeyLocal(new Date());
let calendarCursor=new Date();
let selectedDateKey=currentDateKey;
function dayData(key=currentDateKey){
  if(!state.days[key]) state.days[key]={boxes:[]};
  state.days[key].boxes.forEach(b=>{ if(!b.interruptions) b.interruptions=[]; });
  return state.days[key];
}
let activeId=null,timer=null,paused=false,interrupting=false,lastTick=0,editId=null,currentInterrupt=null;
let drag={id:null,startY:0,origStart:0,duration:0};

const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const toMin=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
const toTime=v=>{v=Math.max(0,Math.min(1439,v));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};
const plan=b=>Math.max(0,toMin(b.end)-toMin(b.start));
const fmt=m=>{m=Math.round(m||0);return m<60?m+'m':Math.floor(m/60)+'h'+(m%60?m%60+'m':'')};
const completed=b=>b.subs.filter(s=>s.done).reduce((a,s)=>a+s.plan,0);
const hourH=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour-h'))||84;

function summary(){
 let p=dayData().boxes.reduce((a,b)=>a+plan(b),0), a=dayData().boxes.reduce((x,b)=>x+(b.actual||0),0);
 let d=dayData().boxes.filter(b=>b.status==='done'), on=d.filter(b=>(b.actual||0)<=plan(b));
 let cp=dayData().boxes.reduce((x,b)=>x+completed(b),0), pct=p?Math.round(cp/p*100):0;
 $('#ring').style.setProperty('--p',pct);$('#pct').textContent=pct+'%';$('#sumPlan').textContent=fmt(p);$('#sumActual').textContent=fmt(a);
 $('#sumDiff').textContent=(a-p===0?'0m':(a-p>0?'+':'-')+fmt(Math.abs(a-p)));$('#sumOn').textContent=on.length+'/'+d.length;
}

function renderTimeline(){
 const tl=$('#timeline');tl.innerHTML='';
 for(let h=7;h<=20;h++){
  let r=document.createElement('div');r.className='hour-row';
  let lab=document.createElement('div');lab.className='time';lab.textContent=String(h).padStart(2,'0')+':00';
  let lane=document.createElement('div');lane.className='lane';lane.dataset.hour=h;
  let hit=document.createElement('button');hit.className='empty-hit';hit.title='クリックでTimeBoxを追加';
  hit.onclick=e=>{
    if(e.detail>1 || e.target!==hit)return;
    let rect=lane.getBoundingClientRect();
    let y=e.clientY-rect.top;
    let m=Math.round((y/hourH()*60)/15)*15;
    m=Math.max(0,Math.min(45,m));
    let st=h*60+m;
    openEditor(toTime(st),toTime(st+60));
  };
  lane.appendChild(hit);
  r.append(lab,lane);tl.appendChild(r);
 }
 dayData().boxes.forEach(b=>placeBox(b));
}

function placeBox(b){
 const startM=toMin(b.start), endM=toMin(b.end);
 const startHour=Math.floor(startM/60);
 if(startHour<7||startHour>20)return;
 const lane=$(`.lane[data-hour="${startHour}"]`); if(!lane)return;
 const top=((startM%60)/60)*hourH();
 const h=Math.max(38,(endM-startM)/60*hourH());
 let x=document.createElement('div');
 {
   const now=new Date(), nowM=now.getHours()*60+now.getMinutes();
   const overdue=(b.status!=='done' && currentDateKey===dateKeyLocal(now) && nowM>toMin(b.end));
   x.className='timebox'+(b.status==='done'?' done':overdue?' overdue':'');
 }
 x.style.top=top+'px'; x.style.height=h+'px';
 x.dataset.id=b.id;
 let pc=plan(b)?Math.round(completed(b)/plan(b)*100):0;
 x.innerHTML='<div class="resize-handle resize-top" data-edge="top"></div><div class="boxline"><div class="boxtext"><strong>'+b.title+'</strong><span class="muted">'+b.start+'–'+b.end+' · '+fmt(plan(b))+'</span></div><div class="actions"><button class="btn primary st">'+(b.status==='done'?'詳細':'START')+'</button><button class="fav">'+(b.favorite?'★':'☆')+'</button></div></div><div class="resize-handle resize-bottom" data-edge="bottom"></div>';
 x.querySelector('.st').onclick=e=>{
   e.stopPropagation();
   startFocus(b.id);
 };
 x.querySelector('.fav').onclick=e=>{
   e.stopPropagation(); b.favorite=!b.favorite;
   if(b.favorite){
     const tpl={title:b.title,duration:plan(b),subs:b.subs.filter(s=>!s.autoMain).map(s=>({name:s.name,plan:s.plan}))};
     const ix=state.templates.findIndex(t=>t.title===b.title);
     if(ix>=0) state.templates[ix]=tpl; else state.templates.push(tpl);
   }
   save();renderAll()
 };
 x.addEventListener('dblclick',e=>{
   if(e.target.closest('button') || e.target.closest('.resize-handle')) return;
   e.preventDefault(); e.stopPropagation();
   openEditor(b.start,b.end,null,b.id);
 });
 x.onpointerdown=e=>{
   if(e.button!==0 || e.target.closest('button'))return;
   const handle=e.target.closest('.resize-handle');
   if(handle){
     drag={id:b.id,startY:e.clientY,origStart:toMin(b.start),duration:plan(b),resize:handle.dataset.edge,origEnd:toMin(b.end)};
   }else{
     drag={id:b.id,startY:e.clientY,origStart:toMin(b.start),duration:plan(b),resize:null,origEnd:toMin(b.end)};
   }
   x.classList.add('dragging');
   x.setPointerCapture(e.pointerId);
 };
 x.onpointermove=e=>{
   if(drag.id!==b.id)return;
   let dy=e.clientY-drag.startY;
   let minsDelta=Math.round((dy/hourH()*60)/15)*15;

   if(drag.resize==='top'){
     let newStart=Math.max(7*60, Math.min(drag.origEnd-15, drag.origStart+minsDelta));
     let newDur=drag.origEnd-newStart;
     let newHour=Math.floor(newStart/60);
     let target=$(`.lane[data-hour="${newHour}"]`);
     if(target && x.parentElement!==target)target.appendChild(x);
     x.style.top=(((newStart%60)/60)*hourH())+'px';
     x.style.height=Math.max(38,newDur/60*hourH())+'px';
     x.querySelector('.boxtext .muted').textContent=toTime(newStart)+'–'+toTime(drag.origEnd)+' · '+fmt(newDur);
   }else if(drag.resize==='bottom'){
     let newEnd=Math.max(drag.origStart+15, Math.min(21*60, drag.origEnd+minsDelta));
     let newDur=newEnd-drag.origStart;
     x.style.height=Math.max(38,newDur/60*hourH())+'px';
     x.querySelector('.boxtext .muted').textContent=toTime(drag.origStart)+'–'+toTime(newEnd)+' · '+fmt(newDur);
   }else{
     let desired=drag.origStart+minsDelta;
     let newStart=clampMoveNoOverlap(drag.origStart,drag.duration,desired,b.id);
     let newHour=Math.floor(newStart/60);
     let target=$(`.lane[data-hour="${newHour}"]`);
     if(target && x.parentElement!==target)target.appendChild(x);
     x.style.top=(((newStart%60)/60)*hourH())+'px';
     x.querySelector('.boxtext .muted').textContent=toTime(newStart)+'–'+toTime(newStart+drag.duration)+' · '+fmt(drag.duration);
   }
 };
 x.onpointerup=e=>{
   if(drag.id!==b.id)return;
   let dy=e.clientY-drag.startY;
   let minsDelta=Math.round((dy/hourH()*60)/15)*15;
   let changed=false;

   if(drag.resize==='top'){
     let newStart=Math.max(7*60, Math.min(drag.origEnd-15, drag.origStart+minsDelta));
     if(newStart!==drag.origStart){
       let oldPlan=plan(b), newPlan=drag.origEnd-newStart, delta=newPlan-oldPlan;
       const ns=toTime(newStart);
       if(!hasOverlap(ns,b.end,b.id)){
         b.start=ns;
         if(b.subs.length) b.subs[b.subs.length-1].plan=Math.max(1,b.subs[b.subs.length-1].plan+delta);
         changed=true;
       }
     }
   }else if(drag.resize==='bottom'){
     let newEnd=Math.max(drag.origStart+15, Math.min(21*60, drag.origEnd+minsDelta));
     if(newEnd!==drag.origEnd){
       let oldPlan=plan(b), newPlan=newEnd-drag.origStart, delta=newPlan-oldPlan;
       const ne=toTime(newEnd);
       if(!hasOverlap(b.start,ne,b.id)){
         b.end=ne;
         if(b.subs.length) b.subs[b.subs.length-1].plan=Math.max(1,b.subs[b.subs.length-1].plan+delta);
         changed=true;
       }
     }
   }else{
     let desired=drag.origStart+minsDelta;
     let newStart=clampMoveNoOverlap(drag.origStart,drag.duration,desired,b.id);
     if(newStart!==drag.origStart){
       b.start=toTime(newStart); b.end=toTime(newStart+drag.duration); changed=true;
     }
   }
   drag={id:null,startY:0,origStart:0,duration:0,resize:null,origEnd:0};
   x.classList.remove('dragging');
   if(changed){ save(); renderAll(); }
 };
 lane.appendChild(x);
}

function showEditorError(msg){
 const el=$('#msg'); if(!el)return;
 el.textContent=msg||'';
 el.classList.toggle('show',!!msg);
}
function hasOverlap(start,end,ignoreId=null){
 const s=toMin(start), e=toMin(end);
 return dayData().boxes.some(b=>{
   if(ignoreId && b.id===ignoreId) return false;
   const bs=toMin(b.start), be=toMin(b.end);
   return s < be && e > bs;
 });
}
function clampMoveNoOverlap(origStart,duration,desiredStart,id){
  const minStart=7*60, maxStart=21*60-duration;
  desiredStart=Math.max(minStart,Math.min(maxStart,desiredStart));
  if(!hasOverlap(toTime(desiredStart),toTime(desiredStart+duration),id)) return desiredStart;
  return origStart;
}

function openEditor(s='09:00',e='10:00',tpl=null,id=null){
 editId=id;
 $('#editorTitle').textContent=id?'TimeBoxを編集':'TimeBoxを作成';
 $('#editorHint').textContent='';
 $('#subs').innerHTML='';
 $('#templatePop').classList.remove('show');
 if(id){
   const b=dayData().boxes.find(x=>x.id===id);
   $('#name').value=b.title;$('#start').value=b.start;$('#end').value=b.end;
   const autoOnly=b.subs.length===1 && b.subs[0].autoMain===true;
   if(!autoOnly) b.subs.forEach(s=>addSub(s.name,s.plan));
 }else if(tpl){
   $('#name').value=tpl.title;$('#start').value=s;$('#end').value=toTime(toMin(s)+tpl.duration);
   tpl.subs.forEach(x=>addSub(x.name,x.plan));
 }else{
   $('#name').value='';$('#start').value=s;$('#end').value=e;
 }
 updateAlloc();showEditorError('');
 $('#editorModal').classList.add('show');
}
function addSub(n='',p=15){
 let r=document.createElement('div');r.className='subrow';
 r.innerHTML='<input class="sn" placeholder="サブタスク" value="'+n+'"><input class="sp" type="number" min="1" value="'+p+'"><button>×</button>';
 r.querySelector('button').onclick=()=>{r.remove();updateAlloc()};r.querySelector('.sp').oninput=updateAlloc;$('#subs').appendChild(r);updateAlloc()
}
function updateAlloc(){
 let rows=$$('.sp'), total=rows.reduce((a,x)=>a+(Number(x.value)||0),0),p=Math.max(0,toMin($('#end').value)-toMin($('#start').value));
 $('#alloc').textContent=rows.length===0?'未入力ならTimeBox本体だけで実行':total+' / '+p+'分'+(total===p?' ✓':'');
}
$('#addSub').onclick=()=>addSub();
function closeEditor(){ $('#editorModal').classList.remove('show'); $('#templatePop').classList.remove('show'); editId=null; }
$('#cancel').onclick=closeEditor;
$('#closeEditor').onclick=closeEditor;
$('#editorModal').onclick=e=>{ if(e.target===$('#editorModal')) closeEditor(); };
$('#start').onchange=updateAlloc;$('#end').onchange=updateAlloc;

function renderTemplateChoices(){
 const c=$('#templateChoices'); c.innerHTML='';
 if(!state.templates.length){ c.innerHTML='<div class="muted" style="margin-top:6px">まだテンプレートがありません。TimeBoxの☆を押すと保存されます。</div>'; return; }
 state.templates.forEach(t=>{
   const b=document.createElement('button'); b.className='template-item';
   b.innerHTML='<strong>'+t.title+'</strong><span class="muted">'+fmt(t.duration)+' · '+t.subs.length+' subtask</span>';
   b.onclick=()=>{ 
     const st=$('#start').value||'09:00';
     $('#name').value=t.title; $('#end').value=toTime(toMin(st)+t.duration); $('#subs').innerHTML='';
     t.subs.forEach(s=>addSub(s.name,s.plan)); updateAlloc(); $('#templatePop').classList.remove('show');
   };
   c.appendChild(b);
 });
}
$('#templateBtn').onclick=()=>{ renderTemplateChoices(); $('#templatePop').classList.toggle('show'); };


$('#save').onclick=()=>{
 let title=$('#name').value.trim();if(!title){showEditorError('タスク名を入力してください');return}
 let st=$('#start').value,en=$('#end').value,p=toMin(en)-toMin(st);
 let rows=$$('.subrow');
 let subs=rows.map(r=>({name:r.querySelector('.sn').value.trim()||'サブタスク',plan:Number(r.querySelector('.sp').value)||1,actual:0,done:false}));
 if(p<=0){showEditorError('終了時刻は開始時刻より後にしてください');return}
 if(hasOverlap(st,en,editId)){showEditorError('その時間帯には既にTimeBoxが設定されています');return}
 if(subs.length===0){
   subs=[{name:title,plan:p,actual:0,done:false,autoMain:true}];
 }else{
   let total=subs.reduce((a,s)=>a+s.plan,0);
   if(total!==p){showEditorError('サブタスク合計をTimeBox時間と一致させてください');return}
 }
 if(editId){
   let b=dayData().boxes.find(x=>x.id===editId);
   // Keep actual/done where names match, otherwise reset.
   subs=subs.map(ns=>{
     let old=b.subs.find(os=>os.name===ns.name);
     return old?{...ns,actual:old.actual||0,done:!!old.done}:ns;
   });
   b.title=title;b.start=st;b.end=en;b.subs=subs;
 }else{
   dayData().boxes.push({id:state.next++,title,start:st,end:en,favorite:false,status:'planned',actual:0,interrupt:0,subs});
 }
 editId=null;save();$('#editorModal').classList.remove('show');renderAll()
};

function active(){return dayData().boxes.find(b=>b.id===activeId)}
function startFocus(id){if($('#interruptForm'))$('#interruptForm').style.display='none';activeId=id;let b=active();if(b.status!=='done')b.status='active';if(!b.interruptions)b.interruptions=[];save();$('#todayOverview').style.display='none';$('#focus').classList.add('show');paused=false;interrupting=false;currentInterrupt=null;lastTick=Date.now();clearInterval(timer);timer=setInterval(tick,1000);renderFocus()}
function tick(){
 let b=active();if(!b)return;
 let now=Date.now(),delta=(now-lastTick)/60000;lastTick=now;
 if(paused)return;
 if(interrupting){
   b.interrupt+=delta;
   if(currentInterrupt) currentInterrupt.duration=(currentInterrupt.duration||0)+delta;
 }else{
   let s=b.subs.find(x=>!x.done);
   if(s){s.actual+=delta;b.actual+=delta}
 }
 save();renderFocus()
}
function renderFocus(){let b=active();if(!b)return; if($('#interruptForm') && interrupting) $('#interruptForm').style.display='none';$('#focusTitle').textContent=b.title;$('#focusMeta').textContent=b.start+'–'+b.end+' · 予定 '+fmt(plan(b));let pc=plan(b)?Math.round(completed(b)/plan(b)*100):0;$('#focusRing').style.setProperty('--p',pc);$('#focusPct').textContent=pc+'%';$('#elapsed').textContent=fmt(b.actual);$('#status').textContent=b.status==='done'?'完了':paused?'一時停止中':interrupting?'割り込み中':'実行中';
 let list=$('#focusList');list.innerHTML='';let ci=b.subs.findIndex(s=>!s.done);
 b.subs.forEach((s,i)=>{
   let r=document.createElement('div');r.className='focusRow'+(i===ci?' current':'');
   r.innerHTML='<div class="step-toggle" data-i="'+i+'">'+(s.done?'✓':i===ci?'▷':'○')+'</div><div class="focusBody"><strong>'+s.name+'</strong><div class="muted">予定 '+fmt(s.plan)+(s.actual?' · 実績 '+fmt(s.actual):'')+'</div></div>';
   r.querySelector('.step-toggle').onclick=()=>{
     if(s.done){
       s.done=false;
       b.status='active';
       save();renderFocus();renderAll();
     }
   };
   list.appendChild(r)
 });
 (b.interruptions||[]).forEach(it=>{
   let r=document.createElement('div');r.className='interrupt-row';
   r.innerHTML='<div>↳</div><div class="focusBody"><strong>'+(it.name||'割り込み')+'</strong><div class="muted">'+fmt(it.duration||0)+(it.active?' · 実行中':'')+'</div></div>';
   list.appendChild(r);
 });
 $('#pause').textContent=paused?'再開':'一時停止';$('#interrupt').textContent=interrupting?'割り込み終了':'割り込み';summary()
}
$('#pause').onclick=()=>{
 if(interrupting){
   interrupting=false;
   if(currentInterrupt) currentInterrupt.active=false;
   currentInterrupt=null;
 }
 paused=!paused;lastTick=Date.now();save();renderFocus()
};
$('#interrupt').onclick=()=>{
 let b=active();if(!b)return;
 if(interrupting){
   interrupting=false;
   if(currentInterrupt) currentInterrupt.active=false;
   currentInterrupt=null;lastTick=Date.now();
   save();renderFocus();
 }else{
   $('#interruptForm').style.display='block';
   $('#interruptName').value='';
   setTimeout(()=>$('#interruptName').focus(),0);
 }
};
$('#interruptStart').onclick=()=>{
 let b=active();if(!b)return;
 const name=$('#interruptName').value.trim()||'割り込み';
 currentInterrupt={name,duration:0,active:true};
 b.interruptions.push(currentInterrupt);
 interrupting=true;paused=false;lastTick=Date.now();
 $('#interruptForm').style.display='none';
 save();renderFocus();
};
$('#interruptCancel').onclick=()=>{$('#interruptForm').style.display='none';};
$('#done').onclick=()=>{let b=active();if(interrupting){interrupting=false;if(currentInterrupt)currentInterrupt.active=false;currentInterrupt=null;}let s=b.subs.find(x=>!x.done);if(s)s.done=true;if(!b.subs.find(x=>!x.done)){b.status='done';clearInterval(timer);paused=true}save();renderFocus();renderAll()};
$('#back').onclick=()=>{if(interrupting){interrupting=false;if(currentInterrupt)currentInterrupt.active=false;currentInterrupt=null;save();}clearInterval(timer);$('#focus').classList.remove('show');$('#todayOverview').style.display='block';renderAll()};

function renderCheck(){renderTodayCheck()}
function renderAnalyze(){let d=dayData().boxes.filter(b=>b.status==='done'),on=d.filter(b=>(b.actual||0)<=plan(b));let p=dayData().boxes.reduce((a,b)=>a+plan(b),0),a=dayData().boxes.reduce((x,b)=>x+(b.actual||0),0),ii=dayData().boxes.reduce((x,b)=>x+(b.interrupt||0),0);$('#score').textContent=(d.length?Math.round(on.length/d.length*100):0)+'%';$('#ratio').textContent=(p?Math.round(a/p*100):0)+'%';$('#intm').textContent=fmt(ii)}

function checkCardHtml(b){
 const diff=(b.actual||0)-plan(b);
 return '<strong>'+b.title+'</strong>'
   +'<div class="muted" style="margin-top:5px">予定 '+fmt(plan(b))+' / 実績 '+fmt(b.actual)+'</div>'
   +'<div class="muted">'+(b.status==='done'?(diff<=0?'時間内完了 ✓':'超過 '+fmt(diff)):'未完了')+'</div>'
   +(b.interrupt?'<div class="muted">割り込み '+fmt(b.interrupt)+'</div>':'');
}
function renderTodayCheck(){
 const c=$('#todayCheckList'); if(!c)return; c.innerHTML='';
 if(!dayData().boxes.length){c.innerHTML='<div class="muted">まだTimeBoxがありません。</div>';return}
 dayData().boxes.forEach(b=>{let x=document.createElement('div');x.className='card';x.innerHTML=checkCardHtml(b);c.appendChild(x)})
}
function dateKeyLocal(d){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');
 return y+'-'+m+'-'+da;
}
function renderCalendar(){
 const g=$('#calendarGrid'); if(!g)return;
 const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();
 $('#calendarMonth').textContent=y+'年 '+(m+1)+'月';
 g.className='cal-grid'; g.innerHTML='';
 ['日','月','火','水','木','金','土'].forEach(w=>{let h=document.createElement('div');h.className='cal-head';h.textContent=w;g.appendChild(h)});
 const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
 for(let i=0;i<42;i++){
   const d=new Date(start); d.setDate(start.getDate()+i);
   const key=dateKeyLocal(d), btn=document.createElement('button');
   btn.className='cal-day'+(d.getMonth()!==m?' out':'')+(key===selectedDateKey?' selected':'')+(key===currentDateKey?' today':'');
   const count=(state.days[key]?.boxes||[]).length;
   btn.innerHTML='<strong>'+d.getDate()+'</strong>'+(count?'<span class="cal-dot">'+count+'件</span>':'');
   btn.onclick=()=>{selectedDateKey=key;renderCalendar();renderSelectedDate()};
   g.appendChild(btn);
 }
 renderSelectedDate();
}
function renderSelectedDate(){
 const boxes=state.days[selectedDateKey]?.boxes||[];
 $('#selectedDateTitle').textContent=selectedDateKey;
 const p=boxes.reduce((a,b)=>a+plan(b),0),a=boxes.reduce((x,b)=>x+(b.actual||0),0);
 const done=boxes.filter(b=>b.status==='done'),on=done.filter(b=>(b.actual||0)<=plan(b));
 const diff=a-p;
 $('#selectedDateSummary').innerHTML=
   '<div class="metric"><span>予定</span><strong>'+fmt(p)+'</strong></div>'+
   '<div class="metric"><span>実績</span><strong>'+fmt(a)+'</strong></div>'+
   '<div class="metric"><span>差</span><strong>'+(diff===0?'0m':(diff>0?'+':'-')+fmt(Math.abs(diff)))+'</strong></div>'+
   '<div class="metric"><span>Score</span><strong>'+(done.length?Math.round(on.length/done.length*100):0)+'%</strong></div>';
 const list=$('#selectedDateList');list.innerHTML='';
 if(!boxes.length){list.innerHTML='<div class="muted">この日の記録はありません。</div>';return}
 boxes.forEach(b=>{let x=document.createElement('div');x.className='card';x.innerHTML=checkCardHtml(b);list.appendChild(x)})
}
$('#prevMonth').onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);renderCalendar()};
$('#nextMonth').onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);renderCalendar()};

$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.v));renderTodayCheck();renderCalendar();renderAnalyze()});

function renderTodayDateTitle(){
  const d=new Date();
  const el=$('#todayDateTitle');
  if(el) el.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';
}

function renderAll(){renderTodayDateTitle();summary();renderTimeline();renderTodayCheck();renderCalendar();renderAnalyze()}
renderAll()
})();
</script>
